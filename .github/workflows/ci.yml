name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (vet + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The repository integration tests connect to postgres:postgres@localhost:5432
      # and create their own h1_canchas_test database (see internal/repository/testmain_test.go).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - name: Run tests
        env:
          REQUIRE_DB: "1"
        run: go test -race ./...
      - name: Apply migrations for the smoke test
        env:
          PGPASSWORD: postgres
        run: |
          for f in migrations/*.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Smoke test against a local build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          JWT_SECRET: ci-only
          MP_ACCESS_TOKEN: ci-only
          MP_WEBHOOK_SECRET: ci-only
          MP_WEBHOOK_URL: http://localhost/payments/webhook
          PORT: "8080"
        run: |
          # Build by package (./cmd, not ./cmd/main.go) so Go embeds the git commit.
          # Output goes outside the checkout so it does not mark the build as -dirty.
          go build -o "$RUNNER_TEMP/h1-canchas" ./cmd
          "$RUNNER_TEMP/h1-canchas" > "$RUNNER_TEMP/server.log" 2>&1 &
          SMOKE_DELAY_SECONDS=2 ../scripts/smoke.sh http://localhost:8080 "$GITHUB_SHA" \
            || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
