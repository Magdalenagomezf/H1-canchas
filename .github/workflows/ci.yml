name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (vet + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The repository integration tests connect to postgres:postgres@localhost:5432
      # and create their own h1_canchas_test database (see internal/repository/testmain_test.go).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - name: Run tests
        env:
          REQUIRE_DB: "1"
        run: go test -race ./...
      - name: Apply migrations for the smoke test
        env:
          PGPASSWORD: postgres
        run: |
          for f in migrations/*.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Smoke test against a local build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          JWT_SECRET: ci-only
          MP_ACCESS_TOKEN: ci-only
          MP_WEBHOOK_SECRET: ci-only
          MP_WEBHOOK_URL: http://localhost/payments/webhook
          PORT: "8080"
        run: |
          # Build by package (./cmd, not ./cmd/main.go) so Go embeds the git commit.
          # Output goes outside the checkout so it does not mark the build as -dirty.
          go build -o "$RUNNER_TEMP/h1-canchas" ./cmd
          "$RUNNER_TEMP/h1-canchas" > "$RUNNER_TEMP/server.log" 2>&1 &
          SMOKE_DELAY_SECONDS=2 ../scripts/smoke.sh http://localhost:8080 "$GITHUB_SHA" \
            || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_BASE_URL: http://localhost:4173
      E2E_API_URL: http://localhost:8080
      # CI-only admin created by frontend/e2e/ci-seed.sql; the database is thrown away after the run.
      E2E_ADMIN_PHONE: "+5493515000001"
      E2E_ADMIN_PASSWORD: e2e-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare database (migrations + E2E admin)
        env:
          PGPASSWORD: postgres
        run: |
          for f in backend/migrations/*.sql frontend/e2e/ci-seed.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          JWT_SECRET: ci-only
          MP_ACCESS_TOKEN: ci-only
          MP_WEBHOOK_SECRET: ci-only
          MP_WEBHOOK_URL: http://localhost/payments/webhook
          ALLOWED_ORIGIN: http://localhost:4173
          PORT: "8080"
        run: |
          go build -o "$RUNNER_TEMP/h1-canchas" ./cmd
          "$RUNNER_TEMP/h1-canchas" > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Build and serve frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080
        run: |
          npm ci
          npm run build
          npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
      - name: Wait for the app
        run: |
          SMOKE_DELAY_SECONDS=2 scripts/smoke.sh http://localhost:8080
          for i in $(seq 30); do curl -sf http://localhost:4173 > /dev/null && exit 0; sleep 1; done
          echo "frontend did not start"; cat "$RUNNER_TEMP/preview.log"; exit 1
      # API integration first: if the API is broken, fail before spending a browser on it.
      - name: Run API integration tests
        working-directory: frontend
        run: npm run test:api
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e
      - name: Upload report and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/backend.log
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
